---
- name: Install Java
  hosts: servers
  become: yes

  tasks:

    - name: Update apt cache
      apt:
        update_cache: yes

    - name: Install Java 21
      apt:
        name: openjdk-17-jdk
        state: present

    - name: Check Java version
      command: java -version
      register: java_version
      ignore_errors: yes

    - name: Print Java version
      debug:
        var: java_version.stderr