apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: school-management

spec:

  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:

    metadata:
      labels:
        app: frontend

    spec:

      containers:

      - name: frontend

        image: mayanksh786/school-frontend:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 80

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "256Mi"

        readinessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 5

        livenessProbe:

          httpGet:
            path: /
            port: 80

          initialDelaySeconds: 10