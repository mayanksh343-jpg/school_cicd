apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: school-management

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

      - name: backend

        image: mayanksh786/school-backend:latest

        imagePullPolicy: Always

        ports:

        - containerPort: 5000

        envFrom:

        - configMapRef:
            name: backend-config

        - secretRef:
            name: backend-secret

        resources:

          requests:
            cpu: "100m"
            memory: "128Mi"

          limits:
            cpu: "500m"
            memory: "512Mi"

        readinessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:

          httpGet:
            path: /health
            port: 5000

          initialDelaySeconds: 20
          periodSeconds: 10